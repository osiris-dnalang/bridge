name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      matrix: { python-version: ["3.10", "3.12"] }
    steps:
      - uses: actions/checkout@v4
        with: { path: bridge }
      - uses: actions/checkout@v4
        with: { repository: osiris-dnalang/organism_sim, path: organism_sim }
      - uses: actions/checkout@v4
        with: { repository: osiris-dnalang/dnalang-core, path: dnalang-core }
      - uses: actions/setup-python@v5
        with: { python-version: "${{ matrix.python-version }}" }
      - run: pip install -e organism_sim -e dnalang-core -e "bridge[dev]" jsonschema
      - run: ruff check --select E,F,W,I --ignore E501 bridge/bridge bridge/tests
      - run: cd bridge && pytest -q
